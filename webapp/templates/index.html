<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StatXI</title>
  <!-- colours first, then layout. Served by Flask from webapp/static/. -->
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <!-- top bar persists across views; #view is swapped by the router -->
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="logo" href="#/">Stat<b>XI</b></a>
      <nav class="nav">
        <a href="#/">Home</a>
        <a href="#/predict">Predict</a>
      </nav>
      <button class="toggle" id="themeToggle" type="button">🌙 Dark</button>
    </div>
  </header>

  <main id="view" class="wrap"></main>

  <!-- classic scripts sharing one window.StatXI namespace. Order matters: define
       the pieces first, then app.js wires them together and starts the router. -->
  <script src="/static/js/flags.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/router.js"></script>
  <script src="/static/js/views/landing.js"></script>
  <script src="/static/js/views/predict.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
